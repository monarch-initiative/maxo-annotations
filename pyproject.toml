[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxoa"
version = "0.1.0"
description = "MAxO annotation pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "hpo-toolkit>=0.8",
    "pronto>=2.5",
    "certifi",
]

[project.scripts]
maxoa = "maxoa.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/maxoa"]
